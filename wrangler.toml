name = "lnmu-network-admin"
main = "index.js"
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_CLOUDFLARE_KV_NAMESPACE_ID"

[vars]
GITHUB_OWNER = "YOUR_GITHUB_USERNAME_OR_ORG"
GITHUB_REPO = "lnmu-network"
ADMIN_GITHUB_LOGIN = "YOUR_GITHUB_LOGIN"
SITE_ORIGIN = "https://YOUR_GITHUB_USERNAME.github.io"
OAUTH_CALLBACK_URL = "https://YOUR-WORKER.workers.dev/auth/callback"
ADMIN_RETURN_URL = "https://YOUR_GITHUB_USERNAME.github.io/lnmu-network/admin/"
